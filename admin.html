<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>MJ Blog Admin</title>
<style>
:root{
  --bg:#f6f1e7; --card:#fffdf8; --ink:#3b2f25; --sub:#7a6a5a; --line:#e3d8c6;
  --brown:#6b4a2f; --gold:#b8893b; --cream:#efe5d2; --red:#a8473a; --green:#4f7a4a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.65 -apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;}
.wrap{max-width:820px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:20px;margin:0 0 4px;color:var(--brown);letter-spacing:.02em}
.lead{color:var(--sub);font-size:12.5px;margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;
  box-shadow:0 1px 3px rgba(80,55,30,.06)}
.card h2{font-size:15px;margin:0 0 12px;color:var(--brown)}
label{display:block;font-size:12px;color:var(--sub);margin:0 0 4px}
input[type=text],input[type=password],textarea{width:100%;border:1px solid var(--line);border-radius:8px;
  padding:9px 11px;font:inherit;color:var(--ink);background:#fff}
textarea{min-height:76px;resize:vertical}
input:focus,textarea:focus{outline:2px solid rgba(184,137,59,.35);border-color:var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>.grow{flex:1 1 220px}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--gold)}
button.main{background:var(--brown);color:#fff;border-color:var(--brown)}
button.main:hover{background:#5a3d26}
button.warn{color:var(--red)}
button:disabled{opacity:.5;cursor:default}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{border-radius:999px;padding:6px 14px}
.tab.on{background:var(--brown);color:#fff;border-color:var(--brown)}
.tab.soon{opacity:.45;cursor:default}
.check{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sub)}
.msg{font-size:12.5px;min-height:1.4em;margin-top:8px}
.msg.ok{color:var(--green)} .msg.err{color:var(--red)}
.today{background:var(--cream);border-left:4px solid var(--gold);border-radius:8px;padding:12px 14px;font-size:13px}
.today .au{color:var(--sub);font-size:12px;margin-top:4px}
.mode{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:#fff;border:1px solid var(--line);
  color:var(--sub);margin-left:6px;vertical-align:1px}
.item{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fff}
.item.hidden{opacity:.55;background:#faf7f1}
.item.pinned{border-color:var(--gold);box-shadow:0 0 0 2px rgba(184,137,59,.18)}
.item .tx{font-size:13.5px;word-break:keep-all;overflow-wrap:break-word}
.item .au{font-size:12px;color:var(--sub);margin-top:3px}
.item .tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.item .tools button{padding:4px 10px;font-size:12px}
.badge{font-size:11px;padding:1px 7px;border-radius:999px;margin-right:6px;vertical-align:1px}
.badge.pin{background:var(--gold);color:#fff}
.badge.off{background:#ddd;color:#555}
.edit textarea{min-height:64px;margin-bottom:6px}
.edit input{margin-bottom:6px}
.hide{display:none!important}
.foot{font-size:11.5px;color:var(--sub);text-align:center;margin-top:24px}
</style>
</head>
<body>
<div class="wrap">
  <h1>MJ Blog Admin</h1>
  <p class="lead">MJ Coffee Science 블로그 사이드바 데이터 관리 · 구글 시트 “MJ Blog Data”에 저장됩니다.</p>

  <!-- 로그인 -->
  <div class="card" id="loginCard">
    <h2>로그인</h2>
    <div class="row">
      <div class="grow">
        <label for="pw">관리 비밀번호</label>
        <input type="password" id="pw" autocomplete="current-password">
      </div>
      <button class="main" id="loginBtn">들어가기</button>
    </div>
    <label class="check" style="margin-top:10px"><input type="checkbox" id="remember"> 이 컴퓨터에서 비밀번호 기억하기</label>
    <details style="margin-top:12px">
      <summary style="font-size:12px;color:var(--sub);cursor:pointer">연결 주소 (웹 앱 URL)</summary>
      <input type="text" id="apiUrl" placeholder="https://script.google.com/macros/s/…/exec" style="margin-top:8px">
    </details>
    <div class="msg" id="loginMsg"></div>
  </div>

  <!-- 관리 -->
  <div id="app" class="hide">
    <div class="tabs">
      <button class="tab on">Today's Aphorism</button>
      <button class="tab soon" title="다음 단계에서 추가">공휴일 · 달력</button>
      <button class="tab soon" title="다음 단계에서 추가">블로그 플레이어</button>
      <button id="logoutBtn" style="margin-left:auto">나가기</button>
    </div>

    <div class="card">
      <h2>오늘 블로그에 보이는 문구 <span class="mode" id="modeTag"></span></h2>
      <div class="today" id="today">—</div>
    </div>

    <div class="card">
      <h2>새 문구 추가</h2>
      <label for="newText">문구</label>
      <textarea id="newText" placeholder="아포리즘 문구를 입력하세요"></textarea>
      <div class="row" style="margin-top:8px">
        <div class="grow">
          <label for="newAuthor">출처 · 지은이</label>
          <input type="text" id="newAuthor" placeholder="예: The Buddha (AN 6.63)">
        </div>
        <button class="main" id="addBtn">추가</button>
      </div>
      <div class="msg" id="addMsg"></div>
    </div>

    <div class="card">
      <h2>문구 목록 <span class="mode" id="countTag"></span></h2>
      <p class="lead" style="margin:-4px 0 12px">
        ‘고정’한 문구가 있으면 매일 그 문구만 보입니다. 고정이 없으면 ‘보이기’ 문구들이 날짜에 따라 돌아가며 나옵니다.
      </p>
      <div id="list"></div>
      <div class="msg" id="listMsg"></div>
    </div>
  </div>

  <div class="foot">MJ Blog Data · Admin v1.0</div>
</div>

<script>
/* ▼ Apps Script 웹 앱 URL (…/exec) 을 여기에 붙여넣으세요 ▼ */
var API_URL = 'https://script.google.com/macros/s/AKfycbxAjTyx3dDTSzo9AdE-31Vr8Ys72mRST7aA9D_I7JOBO1H8yODhSr5gDxavBb3hTrBLkw/exec';

(function () {
  var $ = function (id) { return document.getElementById(id); };
  var PW = '', items = [];

  function store(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }

  function api() { return ($('apiUrl').value || '').trim(); }

  var ERR = {
    'wrong-password': '비밀번호가 맞지 않아요.',
    'no-password-set': 'Apps Script에 ADMIN_PW 스크립트 속성이 아직 없어요.',
    'bad-json': '요청 형식 오류',
    'unknown-action': '알 수 없는 요청'
  };

  function say(el, text, ok) { el.textContent = text || ''; el.className = 'msg ' + (ok ? 'ok' : 'err'); }

  function post(body) {
    body.pw = PW;
    return fetch(api(), {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },  /* CORS 사전 요청 피하기 */
      body: JSON.stringify(body)
    }).then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.ok) throw new Error(ERR[d.error] || d.error || '오류');
        if (d.items) { items = d.items; render(); }
        return d;
      });
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* 블로그 위젯과 같은 규칙으로 오늘 문구 계산 */
  function renderToday() {
    var shown = items.filter(function (x) { return x.show; });
    var pinned = items.filter(function (x) { return x.pin && x.show; })[0];
    var it, mode;
    if (pinned) { it = pinned; mode = '고정'; }
    else if (shown.length) {
      var d = new Date();
      it = shown[(d.getMonth() * 31 + d.getDate()) % shown.length]; mode = '자동 순환';
    }
    $('modeTag').textContent = mode || '';
    $('today').innerHTML = it
      ? esc(it.text) + '<div class="au">— ' + esc(it.author) + '</div>'
      : '보이는 문구가 없어요. (블로그에는 “오늘도 좋은 하루 되세요.”가 나옵니다)';
  }

  function render() {
    renderToday();
    $('countTag').textContent = items.length + '개';
    var box = $('list');
    box.innerHTML = '';
    items.forEach(function (it, i) {
      var el = document.createElement('div');
      el.className = 'item' + (it.show ? '' : ' hidden') + (it.pin ? ' pinned' : '');
      el.innerHTML =
        '<div class="view">' +
          '<div class="tx">' + (it.pin ? '<span class="badge pin">고정</span>' : '') +
            (it.show ? '' : '<span class="badge off">숨김</span>') + esc(it.text) + '</div>' +
          '<div class="au">— ' + esc(it.author || '') + '</div>' +
          '<div class="tools">' +
            '<button data-a="up"' + (i === 0 ? ' disabled' : '') + '>▲</button>' +
            '<button data-a="down"' + (i === items.length - 1 ? ' disabled' : '') + '>▼</button>' +
            '<button data-a="edit">고치기</button>' +
            '<button data-a="show">' + (it.show ? '숨기기' : '보이기') + '</button>' +
            '<button data-a="pin">' + (it.pin ? '고정 해제' : '고정') + '</button>' +
            '<button data-a="del" class="warn">삭제</button>' +
          '</div>' +
        '</div>' +
        '<div class="edit hide">' +
          '<textarea>' + esc(it.text) + '</textarea>' +
          '<input type="text" value="' + esc(it.author || '') + '">' +
          '<div class="tools"><button data-a="save" class="main">저장</button><button data-a="cancel">취소</button></div>' +
        '</div>';
      el.addEventListener('click', function (e) {
        var a = e.target.getAttribute && e.target.getAttribute('data-a');
        if (!a) return;
        act(a, it, el, e.target);
      });
      box.appendChild(el);
    });
  }

  function act(a, it, el, btn) {
    var m = $('listMsg');
    var run = function (body, okText) {
      btn.disabled = true;
      say(m, '저장 중…', true);
      post(body).then(function () { say(m, okText, true); })
        .catch(function (e) { say(m, e.message); btn.disabled = false; });
    };
    if (a === 'edit')   { el.querySelector('.view').classList.add('hide'); el.querySelector('.edit').classList.remove('hide'); return; }
    if (a === 'cancel') { render(); return; }
    if (a === 'save') {
      run({ action: 'aph-update', id: it.id, show: it.show,
            text: el.querySelector('.edit textarea').value,
            author: el.querySelector('.edit input').value }, '고쳤어요.');
      return;
    }
    if (a === 'show') { run({ action: 'aph-update', id: it.id, text: it.text, author: it.author, show: !it.show }, it.show ? '숨겼어요.' : '다시 보이게 했어요.'); return; }
    if (a === 'pin')  { run({ action: 'aph-pin', id: it.pin ? '' : it.id }, it.pin ? '고정을 풀었어요. 자동 순환으로 돌아갑니다.' : '이 문구로 고정했어요.'); return; }
    if (a === 'up' || a === 'down') { run({ action: 'aph-move', id: it.id, dir: a === 'up' ? -1 : 1 }, '순서를 바꿨어요.'); return; }
    if (a === 'del') {
      if (!confirm('이 문구를 삭제할까요?\n\n' + it.text.slice(0, 80))) return;
      run({ action: 'aph-delete', id: it.id }, '삭제했어요.');
    }
  }

  function login() {
    PW = $('pw').value;
    var m = $('loginMsg');
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(api())) { say(m, '연결 주소(…/exec)를 먼저 넣어 주세요.'); return; }
    if (!PW) { say(m, '비밀번호를 넣어 주세요.'); return; }
    say(m, '확인 중…', true);
    $('loginBtn').disabled = true;
    post({ action: 'aph-list' }).then(function () {
      store('mjadm-url', api());
      store('mjadm-pw', $('remember').checked ? PW : null);
      $('loginCard').classList.add('hide');
      $('app').classList.remove('hide');
    }).catch(function (e) { say(m, e.message); })
      .then(function () { $('loginBtn').disabled = false; });
  }

  $('loginBtn').onclick = login;
  $('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });
  $('logoutBtn').onclick = function () {
    PW = ''; items = []; store('mjadm-pw', null);
    $('pw').value = ''; $('remember').checked = false;
    $('app').classList.add('hide'); $('loginCard').classList.remove('hide');
    say($('loginMsg'), '');
  };
  $('addBtn').onclick = function () {
    var t = $('newText').value.trim(), m = $('addMsg');
    if (!t) { say(m, '문구를 입력해 주세요.'); return; }
    $('addBtn').disabled = true; say(m, '저장 중…', true);
    post({ action: 'aph-add', text: t, author: $('newAuthor').value })
      .then(function () { $('newText').value = ''; $('newAuthor').value = ''; say(m, '추가했어요. 블로그에는 바로 반영됩니다.', true); })
      .catch(function (e) { say(m, e.message); })
      .then(function () { $('addBtn').disabled = false; });
  };

  /* 시작 */
  $('apiUrl').value = load('mjadm-url') || (API_URL.indexOf('PASTE') === 0 ? '' : API_URL);
  var saved = load('mjadm-pw');
  if (saved) { $('pw').value = saved; $('remember').checked = true; }
})();
</script>
</body>
</html>
